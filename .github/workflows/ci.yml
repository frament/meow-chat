name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same ref supersedes the run in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-hygiene:
    name: Repo hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # backend/version/VERSION is the only place the release number is written;
      # README, ROADMAP and CHANGELOG hold copies that have to match. And the
      # schema is defined once in database.ApplySchema, which fixtures call
      # instead of keeping their own DDL.
      - name: Version markers and schema source
        run: |
          ./scripts/check-version.sh
          ./scripts/check-schema-single-source.sh

      # The backend used to fall back to a JWT secret that lived in the source,
      # while the repo is public - so anyone could mint an admin token. auth now
      # refuses to start without one; this keeps that from being quietly undone.
      - name: JWT secret is required
        run: ./scripts/check-jwt-secret.sh

      # nginx and ngsw are only exercised in a browser, so a mistake there reaches
      # production and shows up as "the API does not work on my phone" rather than
      # as a failing test. Both were wrong at once.
      - name: Proxy and service worker config
        run: ./scripts/check-proxy-config.sh

  backend:
    name: Backend · go test
    # Pinned rather than ubuntu-latest: the label is mid-migration to Ubuntu 26
    # and the go test step was terminated by the runner on every attempt there.
    runs-on: ubuntu-24.04
    # Bounded so a hung test can't burn the whole budget.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # CGO is mandatory: the driver is mattn/go-sqlite3. gcc/musl-dev ship
      # with the runner image, so this asserts the toolchain instead of
      # installing it. See ROADMAP v2.0.0 (0.1) for the pure-Go migration
      # that will let us drop this.
      - name: Assert CGO toolchain
        run: gcc --version | head -1

      - name: Show runner resources
        run: |
          nproc
          free -h
          df -h "$RUNNER_TEMP" | tail -1

      # NOT `make test-backend`. Its GOMEMLIMIT=12GiB and -p=2/-parallel=2 exist
      # to tame a 16 GB local Mac. Here the recipe was terminated by the runner
      # (SIGTERM, exit 143) about a minute in, right as the CGO packages start
      # compiling, and the runner has 15 GiB with 11 free, so it is not simply
      # a memory shortfall.
      #
      # One package at a time, echoed as it goes: the whole-suite form reported
      # only "canceled" with no clue which package was being built, because a
      # package that dies mid-compile prints nothing. This also serialises the
      # build, which is the point of the -p=2 in the local target.
      - name: go test
        run: |
          cd backend
          for pkg in $(go list ./...); do
            echo "::group::go test $pkg"
            GOMEMLIMIT=4GiB go test -count=1 -p=2 -parallel=2 -timeout=5m "$pkg" || exit 1
            echo "::endgroup::"
          done

  frontend:
    name: Frontend · ng test + build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Production build
        working-directory: frontend
        run: npm run build

      # Chrome is preinstalled on ubuntu-latest and karma-chrome-launcher
      # finds it; --watch=false is what makes Karma exit.
      - name: Unit tests (headless Chrome)
        run: make test-frontend

      # The post-build scripts (build stamp). ng test does not reach them, so
      # without this the writer and the reader could drift with a green run.
      - name: Build script tests (node:test)
        run: make test-scripts
