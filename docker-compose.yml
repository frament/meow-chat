services:
  backend:
    build:
      context: ./backend
      args:
        HOME: /tmp
    ports:
      # Loopback only. Nothing outside the host needs the API directly: the
      # frontend reaches it as `backend:8080` over the compose network, not
      # through this published port. Publishing it on 0.0.0.0 meant the whole
      # API was reachable over plain HTTP from the LAN, which is the TLS bypass
      # this line closes.
      - "127.0.0.1:8080:8080"
    environment:
      - PORT=8080
      - DB_PATH=/data/chat.db
      - WEBAUTHN_RP_ID=${WEBAUTHN_RP_ID:-localhost}
      - WEBAUTHN_RP_ORIGIN=${WEBAUTHN_RP_ORIGIN:-http://localhost:4200}
      - VAPID_CONTACT=${VAPID_CONTACT:-admin@gmail.com}
      # No default on purpose. backend/auth falls back to a secret that lives in
      # the source, so a missing JWT_SECRET would otherwise start a server whose
      # tokens anyone can forge - and this repo is public. main.go refuses to boot
      # without one, which turns a silent downgrade into a loud failure.
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET_is_not_set}
      # Key for message content at rest. Required with no default for the same
      # reason as JWT_SECRET: a server that starts without it would either write
      # content in the clear or fail on the first message. Losing it is loss of
      # history, and it must not live next to the database or inside a backup of
      # it - the point is that a stolen disk does not decrypt the content.
      - MEOWCHAT_ATREST_KEY=${MEOWCHAT_ATREST_KEY:?MEOWCHAT_ATREST_KEY_is_not_set}
    dns:
      - 192.168.1.1
    volumes:
      - chat-data:/data
      - ./uploads:/app/uploads
      - ./backups:/app/backups
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        HOME: /tmp
        # Метка сборки. .git исключён из контекста сборки, поэтому коммит
        # передаётся аргументом; без него бандл на сервере помечался бы
        # "unknown" и сверка с продом была бы невозможна. Значение по
        # умолчанию пустое - тогда скрипт сам спросит git, как при
        # локальной сборке.
        BUILD_COMMIT: ${BUILD_COMMIT:-}
        BUILD_DIRTY: ${BUILD_DIRTY:-}
    ports:
      - "3000:80"
    environment:
      # The only address allowed to reach this port directly: the proxy that
      # terminates TLS (here the router). The port cannot simply be bound to
      # 127.0.0.1 - that proxy is a different machine on the LAN and connects
      # to this host's address, not to its loopback. The default keeps the
      # previous behaviour on installs that do not set it.
      - INGRESS_ALLOW=${INGRESS_ALLOW:-0.0.0.0/0}
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  chat-data:
