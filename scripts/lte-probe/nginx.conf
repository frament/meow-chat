# Статическая заглушка для проверки пути до телефона. TLS здесь не нужен: он
# терминируется на релее, до этого контейнера он не доходит. Поэтому $ssl_*
# ниже всегда пустые - это ожидаемо, а не поломка.
#
# gzip включён, чтобы проба отдавала так же, как приложение: релею и телефону
# одинаково приходится иметь дело со сжатым ответом.
gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 512;
gzip_types text/plain text/html application/javascript text/css application/json;

server {
  listen 8090;
  root /usr/share/nginx/html;
  index index.html;

  # Диагностические заголовки. Без них страница не сказала бы, откуда и по
  # какому протоколу пришёл запрос, и проверка была бы вслепую. nginx отвечает на
  # любой Host, поэтому X-Probe-Served-By нужен, чтобы убедиться, что пришли
  # именно сюда, а не к боевому приложению на том же хосте.
  #
  # Объявлены один раз на уровне server: add_header не наследуется в блок, где
  # объявлен хоть один, - иначе пришлось бы повторять их в каждом location.
  add_header X-Probe-Remote-Addr  $remote_addr           always;
  add_header X-Probe-Forwarded-For $http_x_forwarded_for  always;
  add_header X-Probe-Protocol      $server_protocol       always;
  add_header X-Probe-Host          $http_host             always;
  add_header X-Probe-Served-By     lte-probe              always;
  # Страница намеренно не кэшируется: замеряется время ответа, а не попадание
  # в кэш телефона.
  add_header Cache-Control          "no-store"             always;

  # Тест на объём: несжимаемые данные, иначе gzip ужмёт их втрое и проверка
  # ничего не скажет о пропускной способности.
  location = /bulk.txt {
    try_files /bulk.txt =404;
  }

  # Все прочие пути отдают ту же страницу: проверяет не то, какой адрес запрошен,
  # а как запросы отправляются. Залп из 10 к /burst/0..9 - это десять настоящих
  # обращений к серверу, а не десять чтений из кеша.
  location / {
    try_files /index.html =404;
  }
}