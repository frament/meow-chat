events {}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;

  # Compression. This was missing entirely, so a cold load on a phone pulled
  # 1.16 MB - the whole 762 KB of JS in the clear - and over LTE that was the
  # difference between "loads" and "spins forever". With gzip the same page is
  # ~508 KB, and shrinking the favicon takes it under 285 KB.
  #
  # Compiled for speed in that direction, not for the best possible ratio: the
  # server has cores to spare and the client has a metered, high-latency link.
  gzip on;
  gzip_vary on;
  # `any` and not the default `off`: the router in front terminates TLS and
  # forwards, and the Via header it adds would otherwise switch gzip off.
  gzip_proxied any;
  # nginx defaults this to 1, which is nearly as large as the original. Level 6
  # is where the ratio stops paying for the extra CPU.
  gzip_comp_level 6;
  # Below this the headers cost more than the body saves. Most API replies are
  # a few hundred bytes and were never going to be worth it.
  gzip_min_length 512;
  # Only formats that are not already compressed. Listing image/png, the woff2
  # fonts or image/jpeg here would burn CPU to produce something larger.
  gzip_types
    application/javascript
    application/json
    application/manifest+json
    application/wasm
    application/xml
    image/svg+xml
    text/css
    text/javascript
    text/plain
    text/xml;

  # Timings on every request. Without these the log says a request took a long
  # time but not where the time went - connecting to the backend, the backend's
  # own thinking, or the client's link. That is the question this file exists to
  # answer when something is slow only from one network.
  #   req=  total, as the client experienced it
  #   up=   time the backend took to answer
  #   conn= time to connect to the backend
  #   hdr=  time until the backend's headers arrived
  log_format timed '$time_iso8601 $remote_addr "$request" $status '
                   'req=$request_time up=$upstream_response_time '
                   'conn=$upstream_connect_time hdr=$upstream_header_time '
                   'ua="$http_user_agent"';
  access_log /dev/stdout timed;

  # Keep-alive to the backend. Without it every API request opened a fresh TCP
  # connection to the Go server.
  upstream backend {
    server backend:8080;
    keepalive 32;
  }

  server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # WebSocket. The only place that may ask for an upgrade - the old config sent
    # `Connection: upgrade` on *every* /api request, which is not what a plain GET
    # wants and stops nginx reusing its upstream connection.
    location /api/ws {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      # A chat socket is idle most of the time. The defaults would close it.
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    location /api {
      client_max_body_size 50M;
      proxy_pass http://backend;
      proxy_http_version 1.1;
      # Empty, not "upgrade": this is what lets nginx reuse its connection to the
      # backend.
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_connect_timeout 5s;
      proxy_read_timeout 60s;
    }

    # Загруженные файлы несут в имени метку времени - `1_1782410724064.jpeg`, то
    # есть адрес меняется вместе с содержимым и никогда не указывает на другое.
    # Раньше здесь не было Cache-Control вовсе, поэтому браузер обязан был
    # перепроверять каждую аватарку при каждой загрузке страницы: запрос за
    # запросом через релей, который держит одновременно три соединения, и лента
    # вставала на них. immutable - это кэш на год без единой перепроверки.
    location /uploads {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
